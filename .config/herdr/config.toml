onboarding = false

[terminal]
default_shell = "zsh"

[worktrees]
directory = "~/.herdr/worktrees"

[ui]
mouse_capture = true
status_indicators = "symbols"
prompt_new_tab_name = false
copy_on_select = false

show_agent_labels_on_pane_borders = false
agent_panel_sort = "spaces"

tab_bar_right = [
  { type = "datetime", format = "%-I:%M %p" },
]
tab_bar_right_separator = " | "

# [ui.sidebar.spaces]
# row_gap = 0
# rows = [
#   ["state_icon", "workspace"],
#   ["state_text", "branch", "git_status"],
# ]

# [ui.sidebar.agents]
# row_gap = 0
# rows = [
#   # ["state_icon", "machine", "workspace", "tab"],
#   ["state_icon", "machine", "workspace"],
#   ["state_text", "agent"],
# ]

[ui.toast]
delivery = "herdr"

[theme]
name = "catppuccin"
auto_switch = false

[keys]
prefix = "ctrl+a"

[keys.indexed]
workspaces = "ctrl"
agents = "ctrl+shift"

# >>> herdr-radar theme block
[theme.custom]
active_row_bg = "#414868"
# <<< herdr-radar theme block

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "hhdebb.herdr-radar.view-flip"       # order: active <-> recent

[[keys.command]]
key = "prefix+comma"
type = "plugin_action"
command = "hhdebb.herdr-radar.settings"        # settings popup

[[keys.command]]
key = "prefix+."
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

[[keys.command]]
key = "prefix+ctrl+g"
type = "shell"
command = "herdr pane run \"$(herdr tab create --focus --label ' ↓' | jq -r .result.root_pane.pane_id)\" '/opt/local/bin/lazygit; exit'"
description = "temporary lazygit"

[[keys.command]]
key = "prefix+ctrl+v"
type = "shell"
command = "herdr pane run \"$(herdr tab create --focus --label ' ↓' | jq -r .result.root_pane.pane_id)\" '/Users/sergi/.config/mise/installs/neovim/0.11.0/bin/nvim; exit'"
description = "temporary nvim"

[[keys.command]]
key = "prefix+shift+a"
type = "shell"
command = "herdr pane run \"$(herdr tab create --focus | jq -r .result.root_pane.pane_id)\" 'pi'"
description = "pi"

[[keys.command]]
key = "prefix+shift+c"
type = "popup"
command = "zsh"
width = "90%"
height = "85%"
description = "floating shell popup"

